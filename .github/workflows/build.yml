
name: Build Isile VPN

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "No project ZIP found in repository root"
            exit 1
          fi

          echo "Extracting: $ZIP"
          mkdir project
          unzip -q "$ZIP" -d project
          chmod +x project/scripts/*.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch native components (xray, tun2socks, dnstt)
        working-directory: project
        run: bash scripts/fetch-natives.sh

      - name: Build Release APK only
        working-directory: project
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: IsileVPN-Release
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

