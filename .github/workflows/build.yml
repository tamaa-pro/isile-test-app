name: Build Isile VPN

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP="$(ls *.zip | head -n1)"
          echo "Using $ZIP"
          mkdir project
          unzip -q "$ZIP" -d project
          chmod +x project/scripts/*.sh

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > project/app/isile-release.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch native components (xray, tun2socks, dnstt)
        working-directory: project
        run: bash scripts/fetch-natives.sh

      - name: Build release APK
        working-directory: project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir out
          cp project/app/build/outputs/apk/release/*.apk out/IsileVPN.apk

      - uses: actions/upload-artifact@v7
        with:
          path: out/IsileVPN.apk
          archive: false
